services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager-app
    restart: unless-stopped
    ports:
      # These ports are in format <host-port>:<container-port>
      - '80:80' # Public HTTP Port
      - '443:443' # Public HTTPS Port
      - '81:81' # Admin Web Port
      # Add any other Stream port you want to expose
      # - '21:21' # FTP
    environment:
      # Mysql/Maria connection parameters:
      DB_MYSQL_HOST: "db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "npm"
      DB_MYSQL_NAME: "npm"
      IP_RANGES_FETCH_ENABLED: 'false'
      # Uncomment this if IPv6 is not enabled on your host
      # DISABLE_IPV6: 'true'
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    depends_on:
      - db
    networks:
      - default

  db:
    image: 'yobasystems/alpine-mariadb'
    container_name: nginx-proxy-manager-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'npm'
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD: 'npm'
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - default

  tor-bridges-proxy:
    image: zerolabnet/tor-bridges-proxy:latest
    container_name: tor-bridges-proxy
    ports:
      - "9050:9150"
      - "9151:9151"
    #   - "53:9053"
    restart: unless-stopped
    networks:
      - default

  privoxy:
    image: alpine:latest
    container_name: privoxy
    network_mode: host
    command: sh -c "apk add --no-cache privoxy && echo 'forward-socks5t / 127.0.0.1:9050 .' >> /etc/privoxy/config && echo 'listen-address 0.0.0.0:8118' >> /etc/privoxy/config && echo 'max-client-connections 1024' >> /etc/privoxy/config && privoxy --no-daemon /etc/privoxy/config"
    restart: unless-stopped

networks:
  default:
    external: true
    name: volokzhanin
